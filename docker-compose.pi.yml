# =============================================================================
# Alert Dashboard V2 - Raspberry Pi (LITE) stack
#
# Runs a PREBUILT image (alert-dashboard-v2:lite) - the Pi does NOT build.
# Build the arm64 image on your Windows PC with build-pi-image.ps1, which
# `docker save`s it and loads it here. Then this stack just runs it.
#
# The lite flags live in `environment:` (which overrides env_file), so you can
# reuse your real .env (with all NWWS / social creds) unchanged - no secrets
# are duplicated. The radar / agent stack stays OFF on the Pi.
#
# Usage on the Pi:
#   docker compose -f docker-compose.pi.yml up -d
#   docker compose -f docker-compose.pi.yml logs -f v2
# =============================================================================

services:
  v2:
    image: alert-dashboard-v2:lite
    container_name: alert-dashboard-v2
    restart: unless-stopped
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - PORT=3074
      - DEBUG=false
      # --- Pi (lite) overrides: keep the heavy/unsupported stack OFF ---
      - NEXRAD_ENABLED=false          # no Level 2 radar / storm tracking on the Pi
      - NEXRAD_CHUNKS_ENABLED=false   # no near-real-time chunks pipeline
      - LLM_ENABLED=false             # Ollama assistant -> use the full build on your main PC
      - AGENT_ENABLED=false           # tool-calling agent -> main PC only
      - LIVE_QA_ENABLED=false         # storm-cell QA reporter (radar-dependent)
      - LIVE_QA_LOG_TRAINING_DATA=false  # no unbounded training_data.jsonl growth
    volumes:
      - v2-data:/app/data
      - v2-logs:/app/logs
    # Cap /tmp so any stray temp file can never fill the SD card.
    tmpfs:
      - /tmp:size=256m
    expose:
      - "3074"
    networks:
      - proxy

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy

volumes:
  v2-data:
  v2-logs:
  caddy-data:
  caddy-config:

networks:
  proxy:
    external: true
